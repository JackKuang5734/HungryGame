<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href ="style.css">
	<link rel="stylesheet" href = "loginStyle.css">
	<script type="module" src="joystick.js"></script>
	<script type="module" src="script.js"></script>
	<!-- <script type="module" src="loginScript.js"></script> -->
	<meta charset="utf-8">
	
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	
	<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Rowdies:wght@300&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
	
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
	
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hungry game - video game:  Hungry Game GOTY Edition (DLC = FEAST OR FAMINE)">
    <meta name="theme-color" content="#DDDDDD">		
	<title>HUNGRY GAME</title>
</head>
 
<body>
	
	<div id="canvasHolder"> 
	
	<div id="healthBack">
		<div id="healthReal"></div>
	</div>
	
	<div id="hungerBack">
		<div id="hungerReal"></div>
	</div>
	
	<img src="images/pickupicon.png" alt="pickupButton" id="pickup">
	<canvas id="canvas" width="1920" height="1080"></canvas>
	</div>
	
	<div id="icons">

		<!-- <img src="images/crafting.png" alt="crafting" id="crafting"> -->
		
	<p>Video Game, Hungry Game</p>
	
	</div>

	 <div class="mobileControl">
	 
	 <div class="row">
		<div id="upButton" class = "button" ontouchstart="mobileControl('y', -5)" onmousedown="mobileControl('y', -5, event)" onmouseup="mobileControl('y', 0)"> </div>
	 </div>
	 
	 <div class="row">
		<div id="leftButton" class = "button" ontouchstart="mobileControl('x', -5)" onmousedown="mobileControl('x', -5, event)" onmouseup="mobileControl('x', 0)"></div>
		<div id="rightButton" class = "button" ontouchstart="mobileControl('x', 5)" onmousedown="mobileControl('x', 5, event)" onmouseup="mobileControl('x', 0)"></div>
	 </div>
	 
	 <div class="row">
		<div id="downButton" class = "button" ontouchstart="mobileControl('y', 5)" onmousedown="mobileControl('y', 5, event)" onmouseup="mobileControl('y', 0)"></div>
	 </div>
	 
	 
	 
	 </div>
	
	<!-- <div id="craftingGUI"></div> -->
	
	<div id="startScreen">
	
	<div id="profileHolder">
		<!-- <h5> Login for a username! </h5> -->
		<img src="images/profile.jpg" alt="login / signup button" id="loginSignup">
	</div>
	

		<div class="container">
			
			
			<div id="banner">
				
			</div>
			
			<div id="backdrop">
				<h1 class= "title">HUNGRY GAME</h1>
				
				<div id="instructions">
					<div id="box">
						
						<div id="instructionText">
					
						</div>
					
						<div id="imageHolder">
							<img src="instructions.png" alt = "instructions" id="imageInstructions">
						</div>
						

					</div>
					
				</div>
				
				<div id="absolute">
					<h1 class="play" id="play">Begin the Hunger</h1> 
					<h1 class="play" id="controls">How to Play</h1>
					<div id="alternate">
						<h1 id="back" name = "half" class="play">Prev</h1>
						<h1 id="next" name = "half" class="play">Next</h1>
					</div>
				</div>
				
			</div>
			
			<!-- <div id="contents"> -->
				
				
			<!-- </div> -->
			
		</div>
	
		<div class="loginContainer">

		<h1 id="title">Log in</h1>
				
			<hr>
			<br>
			<input id="name"	placeholder="Username" class="input"><br>
			<input id="email"	placeholder="Email" class="input" type="email"><br>
			<input id="password" placeholder="Password" class="input" type="password"><br>
			<hr>
			<p id="text">New Hungry Gamer?</p><p id="signUp" >   Sign up!</p>
			<button class="register" id="signup">Register</button>
			<br>
		<P id="loginExclusive">
			<button class="register" id="login">Login</button>
		 or
		<button class="register" id="logout">Logout</button>
		</P>
	</div>
	
	<div id="deathScreen">
	
		<div class="container">
		
			<h1 id="deathQuote">LOL</h1>
		
			<h1 class="play" onclick ="window.location.reload()">play again</h1>
		</div>
	
	</div>

    </div>
	
	<div id="warning">
		<h1> It is recommended to play Hungry Game on a rotated screen </h1>
		
		<h1 class="play" id="closeWarning">I Prefer This</h1>
	</div>
</body>	
</html>
